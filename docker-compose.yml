version: '3.8'

services:
  cadastro:
    build:
      context: .
      dockerfile: ./MentoriaAI.Cadastro/Dockerfile
    container_name: mentoria-cadastro
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres-cadastro;Port=5432;Database=mentoria_cadastro;Username=postgres;Password=postgres
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
    depends_on:
      - postgres-cadastro
      - rabbitmq
    networks:
      - mentoria-network
    ports:
      - "5001:8080"

  busca-semantica:
    build:
      context: .
      dockerfile: ./MentoriaAI.BuscaSemantica/Dockerfile
    container_name: mentoria-busca-semantica
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=mentoria-postgres-embeddings;Port=5432;Database=mentoria_embeddings;Username=postgres;Password=postgres
      - OpenAI__ApiKey=${OPENAI_API_KEY}
    depends_on:
      - postgres-embeddings
    ports:
      - "5002:8080"
    networks:
      - mentoria-network

  embeddings:
    build:
      context: .
      dockerfile: ./MentoriaAI.Embeddings/Dockerfile
    container_name: mentoria-embeddings
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres-embeddings;Port=5432;Database=mentoria_embeddings;Username=postgres;Password=postgres
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
      - OpenAI__ApiKey=${OPENAI_API_KEY}
    depends_on:
      - postgres-embeddings
      - rabbitmq
    networks:
      - mentoria-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: mentoria-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    networks:
      - mentoria-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200 || exit 1"]
      interval: 10s
      retries: 5
      start_period: 20s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: mentoria-kibana
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - mentoria-network

  ir-indexer:
    build:
      context: .
      dockerfile: ./MentoriaAI.IRIndexer/Dockerfile
    container_name: mentoria-ir-indexer
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Elastic__Url=http://elasticsearch:9200
      - Elastic__Index=mentoria-index
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
    depends_on:
      elasticsearch:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - mentoria-network

  ir-query:
    build:
      context: .
      dockerfile: ./MentoriaAI.IRQueryService/Dockerfile
    container_name: mentoria-ir-query
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Elastic__Url=http://elasticsearch:9200
      - Elastic__Index=mentoria-index
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5003:8080"
    networks:
      - mentoria-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mentoria-frontend
    ports:
      - "8080:80"
    depends_on:
      - gateway
    profiles: ["prod"]

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: mentoria-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - gateway
    profiles: ["dev"]

  gateway:
    build:
      context: .
      dockerfile: ./MentoriaAI.Gateway/Dockerfile
    container_name: mentoria-gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - SUPABASE__URL=${SUPABASE_URL}
      - SUPABASE__JWT__SECRET=${SUPABASE_JWT_SECRET}
    depends_on:
      - cadastro
      - busca-semantica
      - ir-query
    ports:
      - "5000:8080"
    networks:
      - mentoria-network

  postgres-cadastro:
    image: postgres:15
    container_name: mentoria-postgres-cadastro
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mentoria_cadastro
    ports:
      - "5433:5432"
    networks:
      - mentoria-network

  postgres-embeddings:
    image: pgvector/pgvector:pg15
    container_name: mentoria-postgres-embeddings
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mentoria_embeddings
    ports:
      - "5434:5432"
    networks:
      - mentoria-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: mentoria-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - mentoria-network

networks:
  mentoria-network:
    driver: bridge